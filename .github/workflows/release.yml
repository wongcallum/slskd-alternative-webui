name: Release

on:
  release:
    types: [published]

jobs:
  dist:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches package.json
        run: |
          version=$(jq -r .version package.json)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but package.json has $version"
            exit 1
          fi

      - uses: cachix/install-nix-action@v31
      - run: nix profile add nixpkgs#devenv

      - run: devenv shell -- bash -e -c 'pnpm install --frozen-lockfile && pnpm build'

      - name: Attach the build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp LICENSE dist
          (cd dist && zip -qr ../slskd-alternative-webui.zip .)
          gh release upload "$GITHUB_REF_NAME" slskd-alternative-webui.zip --clobber
